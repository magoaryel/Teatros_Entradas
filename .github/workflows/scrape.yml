name: Scrape Ticket Platforms

on:
  schedule:
    # Odd minutes reduce GitHub's scheduled-run throttling (peak minutes :00/:20/:40 get dropped more)
    - cron: "3,23,43 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1" # stream scraper logs live instead of one flush at the end

# Never let a throttled/slow run pile up on top of the next one — wasted Actions minutes
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      # Discover new shows from showsaryel.com/gira (adds them to the DB)
      - name: Sync shows from showsaryel.com
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: |
          BASE="${INGEST_URL%/api/ingest}"
          curl -sf -X POST --max-time 120 "$BASE/api/sync" || echo "sync failed (non-fatal)"

      # Scrape Vercel-side platforms (gruposmedia/Madrid) — also sends Telegram notifications.
      # Vercel Hobby has no frequent cron, so this workflow is what keeps Madrid updated.
      - name: Scrape gruposmedia via Vercel
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: |
          BASE="${INGEST_URL%/api/ingest}"
          curl -sf --max-time 120 "$BASE/api/cron/scrape" || echo "vercel scrape failed (non-fatal)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # Browser binaries are ~200 MB and never change between runs — caching them
      # saves roughly a minute of Actions time per run.
      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/camoufox
          key: browsers-pw1.49.1-camoufox-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          # xvfb: camoufox headless="virtual" needs a virtual display to pass Cloudflare
          sudo apt-get install -y xvfb

      - name: Install browsers (cache miss only)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium --with-deps
          python -m camoufox fetch

      - name: Install browser system libs (cache hit)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run scraper
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python scripts/scrape_external.py

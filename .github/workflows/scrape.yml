name: Scrape Ticket Platforms

on:
  schedule:
    # Odd minutes reduce GitHub's scheduled-run throttling (peak minutes :00/:20/:40 get dropped more)
    - cron: "3,23,43 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Discover new shows from showsaryel.com/gira (adds them to the DB)
      - name: Sync shows from showsaryel.com
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: |
          BASE="${INGEST_URL%/api/ingest}"
          curl -sf -X POST --max-time 120 "$BASE/api/sync" || echo "sync failed (non-fatal)"

      # Scrape Vercel-side platforms (gruposmedia/Madrid) — also sends Telegram notifications.
      # Vercel Hobby has no frequent cron, so this workflow is what keeps Madrid updated.
      - name: Scrape gruposmedia via Vercel
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: |
          BASE="${INGEST_URL%/api/ingest}"
          curl -sf --max-time 120 "$BASE/api/cron/scrape" || echo "vercel scrape failed (non-fatal)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          # playwright pinned to 1.49.1: newer versions speak a juggler protocol
          # camoufox's bundled Firefox doesn't understand (Browser.setDefaultViewport isMobile error)
          pip install "playwright==1.49.1" requests "camoufox[geoip]"
          playwright install chromium --with-deps
          python -m camoufox fetch

      - name: Run scraper
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python scripts/scrape_external.py
